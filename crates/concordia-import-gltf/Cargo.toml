[package]
name = "concordia-import-gltf"
description = "Concordia glTF 2.0 importer: meshes, materials, textures, node hierarchy as prefabs, skins and clips."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
concordia-assets.workspace = true
concordia-core.workspace = true
concordia-import-model.workspace = true
concordia-scene.workspace = true
concordia-terra.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform", "extras"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
concordia-cluster.workspace = true
concordia-command.workspace = true
tempfile.workspace = true
