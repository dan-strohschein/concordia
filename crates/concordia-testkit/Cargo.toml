[package]
name = "concordia-testkit"
description = "Concordia dev-only test helpers: GPU guards and golden-image comparison."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `golden::RhiGoldens`, the RHI conformance suite's golden check.
rhi = ["dep:concordia-rhi"]

[dependencies]
concordia-rhi = { workspace = true, features = ["conformance"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
nv-flip = "0.1.2"
thiserror.workspace = true
concordia-reflect.workspace = true
concordia-scene.workspace = true
serde.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
