[package]
name = "concordia-shaders"
description = "Concordia shaders: Slang compilation to MSL/SPIR-V, reflection, Rust/Slang layout checks, content-addressed cache and hot reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The Slang `ShaderProvider` the RHI conformance suite uses on every backend.
conformance = ["concordia-rhi/conformance"]

[dependencies]
blake3.workspace = true
concordia-core.workspace = true
concordia-rhi.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Self with `conformance`, so its tests run in a plain workspace build.
concordia-shaders = { path = ".", features = ["conformance"] }
concordia-rhi-metal.workspace = true
concordia-testkit.workspace = true
insta.workspace = true
tempfile.workspace = true
