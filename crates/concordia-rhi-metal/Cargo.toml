[package]
name = "concordia-rhi-metal"
description = "Concordia Metal backend for concordia-rhi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
concordia-rhi.workspace = true
serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-metal-fx = "0.3.2"
objc2-quartz-core = "0.3.2"
block2 = "0.6.2"

[dev-dependencies]
concordia-rhi = { workspace = true, features = ["conformance"] }
concordia-shaders = { workspace = true, features = ["conformance"] }
concordia-testkit = { workspace = true, features = ["rhi"] }
serde_json.workspace = true
