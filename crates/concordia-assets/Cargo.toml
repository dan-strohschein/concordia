[package]
name = "concordia-assets"
description = "Concordia assets: sidecar ids, importers, the content-addressed DDC, built-ins, hot reload and the asset.* API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
concordia-api.workspace = true
concordia-command.workspace = true
concordia-core.workspace = true
concordia-reflect.workspace = true
concordia-scene.workspace = true
concordia-terra.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
