thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
concordia-studio.workspace = true

[dev-dependencies]
concordia-input.workspace = true
base64.workspace = true
concordia-anim.workspace = true
concordia-audio.workspace = true
hound.workspace = true
concordia-nav.workspace = true
concordia-render.workspace = true
concordia-replay.workspace = true
serde.workspace = true
