[package]
name = "concordia-script"
description = "The scripting host seam: ScriptBackend, ScriptProcessor, the conformance suite and the in-process test backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The backend conformance suite (`conformance_suite!`), for backend crates' tests.
conformance = []

[dependencies]
blake3.workspace = true
concordia-core.workspace = true
concordia-reflect.workspace = true
concordia-script-guest.workspace = true
concordia-script-protocol.workspace = true
concordia-terra.workspace = true
concordia-terra-sim.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
concordia-script = { path = ".", features = ["conformance"] }
conformance-guest = { path = "../../tests/fixtures/script/conformance-guest" }
concordia-reflect.workspace = true
serde.workspace = true

[lints]
workspace = true
