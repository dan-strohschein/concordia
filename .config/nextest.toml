[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# Tests that may compile code themselves (trybuild cases; the M0, M1 and M2 MCP gates when run outside a
# workspace test build) get a longer limit; everything else keeps the 2-minute hang guard.
[[profile.default.overrides]]
filter = "test(=derive_rejects_unsupported_input) | binary(m0_headless_mcp) | binary(m1_mcp_screenshot) | binary(m1_mcp_coverage) | binary(m2_lamplight)"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"
