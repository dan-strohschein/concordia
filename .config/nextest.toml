[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# concordia-tests' gates and integration tests share one binary (`integration`); a file's tests
# are selected by their module prefix, e.g. `test(/^canyon::/)`.

# Tests that may compile code themselves (trybuild cases; the M0 and M1 MCP gates when run outside a
# workspace test build; the M3 gates, which build the fixture's module) get a longer limit;
# everything else keeps the 2-minute hang guard.
[[profile.default.overrides]]
filter = "test(=derive_rejects_unsupported_input) | (binary_id(concordia-tests::integration) & test(/^(m0_headless_mcp|m1_mcp_screenshot|m1_mcp_coverage|m3_[a-z_]+)::/))"
slow-timeout = { period = "60s", terminate-after = 10 }

# The canyon (M4 4.4c) restores and imports 2 M unique triangles on a cold run, then rides two camera
# paths on both draw paths at 22 M source triangles.
[[profile.default.overrides]]
filter = "binary_id(concordia-tests::integration) & test(/^(canyon|m4_meshlet_geometry|m4_fallbacks)::/)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The M2 gate plays and replays whole Lamplight nights in debug builds: about 5 minutes on a
# fast machine, over 10 on CI runners.
[[profile.default.overrides]]
filter = "binary_id(concordia-tests::integration) & test(/^m2_lamplight::/)"
slow-timeout = { period = "60s", terminate-after = 25 }

# The Snuffer's 40 s replay (M4 4.13a) runs about a minute alone in a debug build, longer
# beside the rest of the suite; its Rust twin (4.13b) runs two such nights in lockstep.
[[profile.default.overrides]]
filter = "binary_id(concordia-tests::integration) & test(/^(lamplight_snuffer|m4_graph_enemy)::/)"
slow-timeout = { period = "60s", terminate-after = 8 }

# GPU timing comparisons need the GPU to themselves: the test claims every test thread so nothing
# runs beside it, and perf tests may retry twice (M4 plan's perf rule; every attempt is logged).
[[profile.default.overrides]]
filter = "test(=pass_timer_overhead_under_2_percent)"
threads-required = "num-test-threads"
retries = 2

# The VSM TAA trailing test (M4 4.7b) runs CSM and VSM through four renderers each (about 90 s
# alone, longer under a full workspace run).
[[profile.default.overrides]]
filter = "test(=moving_shadow_does_not_ghost_under_taa)"
slow-timeout = { period = "60s", terminate-after = 6 }

# VSM's pool and eviction tests sort and evict thousands of pages; on lavapipe (Vulkan's CPU
# renderer) they ran 114-152 s at M4's end, past the 2-minute guard.
[[profile.default.overrides]]
filter = "package(concordia-render) & test(/eviction_takes_the_oldest_first_and_is_deterministic|physical_pool_exhaustion_degrades_to_coarser_level_not_artifacts|auto_mover_draws_only_into_dynamic_pages/)"
slow-timeout = { period = "60s", terminate-after = 5 }

# Blessing a path-traced reference (`just bless-reference`) traces for minutes at full quality.
[[profile.default.overrides]]
filter = "binary(bless_reference)"
slow-timeout = { period = "60s", terminate-after = 60 }

[profile.ci]
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"
