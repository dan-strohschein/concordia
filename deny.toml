# cargo-deny policy: permissive licenses only (docs/clean-room.md, ADR-0022).
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # chrono is "unmaintained" (not a vulnerability). It is a required dependency of rmcp
  # (and of rmcp's schemars). Re-check at every rmcp upgrade and drop this entry as soon
  # as rmcp no longer needs chrono; fallback is rust-mcp-sdk (ADR-0033).
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by rmcp 3.11 (ADR-0033)" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
exceptions = []
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
