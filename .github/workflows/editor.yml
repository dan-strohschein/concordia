name: editor

# The editor UI: lint, unit tests, and the generated-types drift check. Runs when the editor, the
# engine crates (whose schemas the types come from) or the example project change.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "editor/**"
      - "crates/**"
      - "examples/**"
      - "justfile"
      - ".github/workflows/editor.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ui:
    name: editor ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: editor/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/ui/pnpm-lock.yaml
      - name: Install (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (tsc, ESLint, Prettier)
        run: pnpm lint
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Install pinned Rust toolchain
        working-directory: .
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - name: Generated types match the engine schemas
        working-directory: .
        run: |
          just editor-schemas
          git diff --exit-code -- editor/ui/src/api/generated editor/ui/tests/fixtures/schemas || {
            echo "::error::editor types are stale; run 'just editor-schemas' and commit the result"
            exit 1
          }

  e2e:
    name: editor e2e (macos-26 GPU)
    runs-on: macos-26
    env:
      CONCORDIA_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/toolchain/slang
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang/slang.toml') }}
      - name: Slang toolchain
        run: just slang-fetch
      - name: Build the engine CLI
        run: cargo build -p concordia-cli
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: editor/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/ui/pnpm-lock.yaml
      - name: Install and Chromium
        working-directory: editor/ui
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium
      - name: End-to-end tests (Playwright, browser mode)
        working-directory: editor/ui
        run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: editor-e2e-results
          path: editor/ui/test-results
