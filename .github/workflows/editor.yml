name: editor

# The editor UI: lint, unit tests, and the generated-types drift check. Runs when the editor, the
# engine crates (whose schemas the types come from) or the example project change. The macOS GPU
# jobs (end-to-end, native shell) are in the manual `regression` workflow (ADR-0071).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "editor/**"
      - "crates/**"
      - "examples/**"
      - "justfile"
      - ".github/workflows/editor.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ui:
    name: editor ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: editor/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/ui/pnpm-lock.yaml
      - name: Install (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (tsc, ESLint, Prettier)
        run: pnpm lint
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Install pinned Rust toolchain
        working-directory: .
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - name: ALSA headers (cpal's Linux backend, M2 2.7a.2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Generated types match the engine schemas
        working-directory: .
        run: |
          just editor-schemas
          git diff --exit-code -- editor/ui/src/api/generated editor/ui/tests/fixtures/schemas || {
            echo "::error::editor types are stale; run 'just editor-schemas' and commit the result"
            exit 1
          }

