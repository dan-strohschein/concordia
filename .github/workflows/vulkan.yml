name: vulkan

# The Vulkan backend's device tests on Mesa's software Vulkan (lavapipe) under the Khronos
# validation layers (ADR-0088). Its own workflow so ci.yml stays fast (ADR-0071); it runs only
# when the RHI, the shaders or the backend change.
on:
  push:
    branches: [main]
    paths:
      - "crates/concordia-rhi/**"
      - "crates/concordia-rhi-vulkan/**"
      - "crates/concordia-shaders/**"
      - "crates/concordia-testkit/**"
      - "tests/golden/rhi/**"
      - "Cargo.lock"
      - ".github/workflows/vulkan.yml"
  pull_request:
    paths:
      - "crates/concordia-rhi/**"
      - "crates/concordia-rhi-vulkan/**"
      - "crates/concordia-shaders/**"
      - "crates/concordia-testkit/**"
      - "tests/golden/rhi/**"
      - "Cargo.lock"
      - ".github/workflows/vulkan.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  vulkan:
    name: vulkan (lavapipe, informational)
    runs-on: ubuntu-24.04
    # The Vulkan backend's device tests on Mesa's software Vulkan under the Khronos validation
    # layers (ADR-0088). Informational until the author re-tests the backend on another machine;
    # then this drops continue-on-error and the regression workflow's Linux job runs it too.
    continue-on-error: true
    env:
      CONCORDIA_REQUIRE_VULKAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-nextest
      - name: Vulkan (Mesa lavapipe, the Khronos validation layers, the loader)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
      - name: Vulkan devices
        run: vulkaninfo --summary
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/toolchain/slang
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang/slang.toml') }}
      - name: Slang toolchain
        run: just slang-fetch
      - name: Vulkan backend tests
        run: cargo nextest run -p concordia-rhi-vulkan --profile ci --no-tests=fail
      - name: This runner's probe record (for fixtures)
        if: always()
        run: cargo nextest run -p concordia-rhi-vulkan --run-ignored only -E 'test(print_this_machines_probe_record)' --no-capture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-failures-vulkan
          path: target/golden-failures/
          if-no-files-found: ignore
