name: vulkan

# Builds the Vulkan backend and runs its device tests, the renderer's suite and the M1 gate golden
# on Mesa's software Vulkan (lavapipe) under the Khronos validation layers (ADR-0088; any
# validation error fails), on demand only (Actions → vulkan → Run workflow, or
# `gh workflow run vulkan --ref <branch>`; author decision 2026-11-25). ci.yml stays fast (ADR-0071).
on:
  workflow_dispatch:
    inputs:
      filter:
        description: nextest filter expression for the backend's tests (all by default)
        type: string
        default: all()
      render_filter:
        description: nextest filter expression for the renderer's tests on Vulkan (all by default)
        type: string
        default: all()

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  vulkan:
    name: vulkan (lavapipe)
    runs-on: ubuntu-24.04
    env:
      CONCORDIA_REQUIRE_VULKAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-nextest
      - name: Vulkan (Mesa lavapipe, the Khronos validation layers, the loader)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools libasound2-dev
      - name: Vulkan devices
        run: vulkaninfo --summary
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/toolchain/slang
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang/slang.toml') }}
      - name: Slang toolchain
        run: just slang-fetch
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/gltf-sample-assets
          key: gltf-${{ hashFiles('tests/fixtures/gltf-sample-assets/manifest.ron') }}
      - name: glTF sample assets (the renderer's conformance goldens)
        run: just gltf-assets
      - name: Vulkan backend tests
        run: cargo nextest run -p concordia-rhi-vulkan --profile ci --no-tests=fail -E "$FILTER"
        env:
          FILTER: ${{ inputs.filter }}
      - name: Renderer on Vulkan (the render suite)
        if: ${{ !cancelled() }}
        run: cargo nextest run -p concordia-render --profile ci --no-fail-fast -E "$RENDER_FILTER"
        env:
          CONCORDIA_BACKEND: vulkan
          CONCORDIA_VULKAN_VALIDATION: strict
          CONCORDIA_GOLDEN_KEEP: "1"
          RENDER_FILTER: ${{ inputs.render_filter }}
      - name: M1 gate golden on Vulkan
        if: ${{ !cancelled() }}
        run: cargo nextest run -p concordia-tests --profile ci -E 'binary(m1_physics_golden)'
        env:
          CONCORDIA_BACKEND: vulkan
          CONCORDIA_VULKAN_VALIDATION: strict
          CONCORDIA_GOLDEN_KEEP: "1"
      - name: gpu-probe on Vulkan
        if: ${{ !cancelled() }}
        run: cargo run -q -p concordia-cli -- gpu-probe --backend vulkan --require-m1
      - name: concordia run in an X11 window on Vulkan (Xvfb, the latency bench's frames)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends xvfb libxcursor1 libxrandr2 libxi6 libxkbcommon-x11-0
          xvfb-run -a -s "-screen 0 1280x720x24" cargo run -q -p concordia-cli -- run \
            --project examples/m1-physics-stack --bench-latency target/vulkan-window.json \
            --bench-frames 20 --bench-hz 30 --exit-after-ms 120000 2>&1 | tee target/vulkan-window.log
          # lavapipe renders 1280x720 slowly and queued frames coalesce, so not all 20 appear.
          test "$(jq '[.frames[] | select(.presented_ms != null)] | length' target/vulkan-window.json)" -ge 3
          ! grep -i "validation" target/vulkan-window.log
        env:
          CONCORDIA_VULKAN_VALIDATION: strict
      - name: This runner's probe record (for fixtures)
        if: always()
        run: cargo nextest run -p concordia-rhi-vulkan --run-ignored only -E 'test(print_this_machines_probe_record)' --no-capture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: golden-vulkan
          path: |
            target/golden-failures/
            target/vulkan-window.*
          if-no-files-found: ignore
