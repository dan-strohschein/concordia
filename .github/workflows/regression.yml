name: regression

# The full regression suite, run by hand (Actions → regression → Run workflow; ADR-0071):
# the test suite on macOS (GPU) and Linux, doc tests, the milestone gates, and the editor's
# macOS GPU jobs (end-to-end and native shell). `ci` runs only the fast checks automatically.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which part of the suite to run
        type: choice
        default: all
        options: [all, engine, editor]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic backtraces readable while cutting compile/link time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  gate:
    name: gate (${{ matrix.os }})
    if: inputs.suite != 'editor'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # GPU tests (RHI conformance, goldens) must run on macOS; Linux skips them until Vulkan (ADR-0042).
    env:
      CONCORDIA_REQUIRE_GPU: ${{ startsWith(matrix.os, 'macos') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-nextest,wasm-tools
      - name: ALSA headers (cpal's Linux backend, M2 2.7a.2)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/toolchain/slang
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang/slang.toml') }}
      - name: Slang toolchain
        run: just slang-fetch
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/gltf-sample-assets
          key: gltf-${{ hashFiles('tests/fixtures/gltf-sample-assets/manifest.ron') }}
      - name: glTF sample assets
        run: just gltf-assets
      - name: Build WASM fixtures
        run: just wasm
      - name: Build native module fixtures
        run: just native-fixtures
      - name: Tests
        run: cargo nextest run --workspace --profile ci --no-tests=fail
      - name: GPU probe (built by the test step)
        if: always() && startsWith(matrix.os, 'macos')
        run: target/debug/concordia gpu-probe
      - name: Doc tests
        run: cargo test --doc --workspace
      - name: Gates
        run: |
          just gate-tests M-1
          just gate-tests M0
          just gate-tests M1
          just gate-tests M2
          just gate-tests M3S
          just gate-tests M3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-failures-${{ matrix.os }}
          path: target/golden-failures/
          if-no-files-found: ignore

  e2e:
    name: editor e2e (macos-26 GPU)
    if: inputs.suite != 'engine'
    runs-on: macos-26
    env:
      CONCORDIA_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/toolchain/slang
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang/slang.toml') }}
      - name: Slang toolchain
        run: just slang-fetch
      - name: Build the engine CLI
        run: cargo build -p concordia-cli
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: editor/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/ui/pnpm-lock.yaml
      - name: Install and Chromium
        working-directory: editor/ui
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium
      - name: End-to-end tests (Playwright, browser mode)
        working-directory: editor/ui
        run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: editor-e2e-results
          path: editor/ui/test-results

  shell:
    name: editor shell (macos-26 GPU)
    if: inputs.suite != 'engine'
    runs-on: macos-26
    env:
      CONCORDIA_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: editor/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-deny
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/toolchain/slang
          key: slang-${{ runner.os }}-${{ hashFiles('tools/slang/slang.toml') }}
      - name: Slang toolchain
        run: just slang-fetch
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: editor/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/ui/pnpm-lock.yaml
      - name: Build the UI
        working-directory: editor/ui
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
      - name: Supply chain (shell; named MPL-2.0 exceptions)
        run: cargo deny --manifest-path editor/src-tauri/Cargo.toml --config editor/src-tauri/deny.toml check
      - name: Host tests and native smoke test
        run: cargo test --manifest-path editor/src-tauri/Cargo.toml
