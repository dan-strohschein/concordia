# Concordia project manifest.
[project]
name = "m4-canyon"

[scene]
main = "scenes/canyon.scene.ron"

[assets]

# Rocks and ground strips are generated (gen.run) and restored from their sidecars' recipes
# (gen.restore); the .glb files are not in git.
[gen]

[render]
# Virtual shadow maps (M4 4.7b), cached; [render.vsm] keeps its defaults.
shadows = "vsm"
