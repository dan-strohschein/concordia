[workspace]
resolver = "3"
members = ["crates/*", "tests", "tests/fixtures/script/*", "examples/*/scripts/*"]
exclude = ["tests/fixtures/wasm/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dan-strohschein/concordia"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
concordia-api = { path = "crates/concordia-api" }
concordia-app = { path = "crates/concordia-app" }
concordia-anim = { path = "crates/concordia-anim" }
concordia-assets = { path = "crates/concordia-assets" }
concordia-mcp = { path = "crates/concordia-mcp" }
concordia-physics = { path = "crates/concordia-physics" }
concordia-platform = { path = "crates/concordia-platform" }
concordia-command = { path = "crates/concordia-command" }
concordia-core = { path = "crates/concordia-core" }
concordia-import-fbx = { path = "crates/concordia-import-fbx" }
concordia-import-gltf = { path = "crates/concordia-import-gltf" }
concordia-import-model = { path = "crates/concordia-import-model" }
concordia-input = { path = "crates/concordia-input" }
concordia-terra = { path = "crates/concordia-terra" }
concordia-scene = { path = "crates/concordia-scene" }
concordia-script = { path = "crates/concordia-script" }
concordia-script-abi = { path = "crates/concordia-script-abi" }
concordia-script-guest = { path = "crates/concordia-script-guest" }
concordia-script-protocol = { path = "crates/concordia-script-protocol" }
concordia-script-native = { path = "crates/concordia-script-native" }
concordia-script-wasm = { path = "crates/concordia-script-wasm" }
concordia-scripting = { path = "crates/concordia-scripting" }
concordia-terra-sim = { path = "crates/concordia-terra-sim" }
concordia-terra-crowd = { path = "crates/concordia-terra-crowd" }
concordia-shaders = { path = "crates/concordia-shaders" }
concordia-studio = { path = "crates/concordia-studio" }
concordia-reflect = { path = "crates/concordia-reflect" }
concordia-material = { path = "crates/concordia-material" }
concordia-nav = { path = "crates/concordia-nav" }
concordia-replay = { path = "crates/concordia-replay" }
concordia-reflect-derive = { path = "crates/concordia-reflect-derive" }
concordia-render = { path = "crates/concordia-render" }
concordia-rhi = { path = "crates/concordia-rhi" }
concordia-rhi-metal = { path = "crates/concordia-rhi-metal" }
concordia-testkit = { path = "crates/concordia-testkit" }
jolt-sys = { path = "crates/jolt-sys" }
ufbx-sys = { path = "crates/ufbx-sys" }
recast-sys = { path = "crates/recast-sys" }
bitflags = "2.13"
blake3 = "1.8"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
erased-serde = "0.4"
futures = "0.3"
insta = { version = "1.49", features = ["json", "redactions"] }
jsonschema = { version = "0.61", default-features = false }
proc-macro2 = "1"
proptest = "1.12"
clap = { version = "4.6", features = ["derive"] }
quote = "1"
syn = { version = "3", features = ["full"] }
tempfile = "3"
trybuild = "1"
libm = "0.2.16"
# Audio (M2 2.7a, ADR-0066): permissive decoders only (no MPL symphonia); rtrb for the lock-free queues.
hound = "3.5.1"
lewton = "0.10.2"
rtrb = "0.4.1"
# Test-only allocation counter for the mix callback (author decision A2): no unsafe in our code.
allocation-counter = "0.8.1"
glam = { version = "0.34", features = ["serde"] }
ryu = "1"
rand_chacha = "0.10"
rand_core = "0.10"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
thiserror = "2"
base64 = "0.22.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
uuid = { version = "1.29", default-features = false, features = ["std", "v7"] }
regex = "1.13"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process"] }
serde_json = "1.0"
wasmparser = "0.263"
wit-bindgen = "0.63"
wasip2 = "2.0.1"
# No default `cache` feature: it pulls in MPL-2.0 code, and precompiled components live in the DDC.
wasmtime = { version = "=51.0.0", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "pooling-allocator", "parallel-compilation"] }
wasmtime-wasi = "=51.0.0"
toml = "1.2"

[profile.dev.package."*"]
opt-level = 1

# The CPU image-based-lighting prefilter runs on the first capture of a scene with a sky; unoptimized
# it blocks the engine for seconds (and timed out the editor's e2e tests in CI).
[profile.dev.package.concordia-render]
opt-level = 2

# Terra's 100k-entity determinism tests (templates, LOD) run hundreds of ticks; unoptimized they
# approach nextest's hang guard under a full parallel test run.
[profile.dev.package.concordia-terra]
opt-level = 1

# Crowd tests step 1,000 and 10,000 agents (each with Detour queries) for hundreds of ticks; the
# crowd and the Detour it calls are optimized so they stay well inside nextest's hang guard.
[profile.dev.package.concordia-terra-crowd]
opt-level = 2

[profile.dev.package.recast-sys]
opt-level = 2
