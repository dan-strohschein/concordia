[workspace]
resolver = "3"
members = ["crates/*", "tests"]
exclude = ["tests/fixtures/wasm/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dan-strohschein/concordia"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
concordia-core = { path = "crates/concordia-core" }
glam = { version = "0.34", features = ["serde"] }
rand_chacha = "0.10"
rand_core = "0.10"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
uuid = { version = "1.29", default-features = false, features = ["std", "v7"] }
regex = "1.13"
serde_json = "1.0"
wasmparser = "0.263"
wasmtime = "=50.0.2"
wasmtime-wasi = "=50.0.2"
toml = "1.2"

[profile.dev.package."*"]
opt-level = 1
