[package]
name = "conformance-guest"
description = "The script conformance module: the reference behavior every backend's suite checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# A second build with changed behavior, for reload tests.
v2 = []
# A build with changed component layouts (Position gains z, Velocity loses y), for migration tests.
layout2 = []
# Export the native module C ABI (ADR-0061) from the cdylib.
dylib = []

[dependencies]
concordia-reflect.workspace = true
concordia-script-guest.workspace = true
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2.workspace = true

[lints]
workspace = true
