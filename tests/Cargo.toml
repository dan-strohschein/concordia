[package]
name = "concordia-tests"
description = "Cross-crate integration and milestone gate tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[dependencies]
# The M3 gate's shared checker (src/m3_checker.rs) drives an engine and reads the Studio journal.
# src/reference.rs blesses path-traced references (testkit's FLIP; this crate never ships).
base64.workspace = true
concordia-api.workspace = true
concordia-pathtrace.workspace = true
concordia-testkit.workspace = true
concordia-app.workspace = true
concordia-core.workspace = true
# The canyon (M4 4.4c): its builder, and src/canyon.rs, which the canyon tests and the M4 gate
# share (restore, load the example, render its paths on each draw path).
concordia-assets.workspace = true
concordia-cluster.workspace = true
concordia-gen.workspace = true
concordia-perf.workspace = true
concordia-reflect.workspace = true
concordia-render.workspace = true
concordia-rhi.workspace = true
concordia-rhi-select.workspace = true
concordia-scene.workspace = true
concordia-shaders.workspace = true
concordia-terra.workspace = true
concordia-replay.workspace = true
concordia-studio.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
concordia-audio.workspace = true
concordia-input.workspace = true
concordia-mcp.workspace = true
concordia-rhi-metal.workspace = true
concordia-ui.workspace = true
insta.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
wasmparser.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

